<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Rodinný kalendář</title>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Pracovna rodinného kalendáře: papír a inkoust, tyrkysová z máminých rámečků.
   Vlevo seznam stránek, uprostřed náhled jako na papíře, vpravo panel s úpravami. */
:root {
  --bg: #EEF2F3;
  --panel: #FFFFFF;
  --ink: #1A2226;
  --muted: #5A676E;
  --line: #D5DEE1;
  --accent: #2B7C91;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEEF2;
  --warn: #9A5B00;
  --warn-soft: #FFF2D9;
  --danger: #B3261E;
  --ok: #2D7A4B;
  --focus: #E9A100;
  --paper-shadow: 0 1px 2px rgba(20, 40, 50, .08), 0 8px 24px rgba(20, 40, 50, .10);
  --sans: "Kal Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif: "Kal Serif", Georgia, "Times New Roman", serif;
  --head-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181B; --panel: #192226; --ink: #E4ECEE; --muted: #97A6AC; --line: #2C393E;
    --accent: #5DB6CB; --accent-ink: #082027; --accent-soft: #1C3940; --warn: #F0B455; --warn-soft: #33290F;
    --danger: #F08A80; --ok: #6CC48F; --focus: #F2B632; --paper-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181B; --panel: #192226; --ink: #E4ECEE; --muted: #97A6AC; --line: #2C393E;
  --accent: #5DB6CB; --accent-ink: #082027; --accent-soft: #1C3940; --warn: #F0B455; --warn-soft: #33290F;
  --danger: #F08A80; --ok: #6CC48F; --focus: #F2B632; --paper-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
a { color: var(--accent); }
h2, h3 { font-family: var(--serif); font-weight: 700; margin: 0; text-wrap: balance; }
h2 { font-size: 1.35rem; } h3 { font-size: 1.15rem; }
h2 small { font-family: var(--sans); font-weight: 400; color: var(--muted); font-size: .9rem; margin-left: .4rem; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.muted { color: var(--muted); }
.grow { flex: 1; }
.red { color: var(--danger); }

/* tlačítka a ovládací prvky */
.btn { font: inherit; font-weight: 500; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: .5rem .9rem; border-radius: 8px; cursor: pointer; line-height: 1.2; text-align: center; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.ghost:hover:not(:disabled) { border-color: var(--line); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger-ghost { background: transparent; border-color: transparent; color: var(--danger); padding-left: 0; text-align: left; }
.btn.sm { padding: .3rem .6rem; font-size: .88rem; }
.btn.big { padding: .8rem 1.4rem; font-size: 1.05rem; }
.btn.icon { width: 2.2rem; height: 2.2rem; padding: 0; font-size: 1.3rem; line-height: 1; }
input, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: .4rem .55rem; min-width: 0; }
input[type="checkbox"] { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
input[type="range"] { width: 100%; accent-color: var(--accent); padding: 0; border: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); flex-wrap: nowrap; }
.seg.wrap { flex-wrap: wrap; gap: .5rem; border: 0; overflow: visible; background: transparent; align-items: center; }
.seg button:not(.btn) { font: inherit; border: 0; background: transparent; color: var(--ink); padding: .45rem .8rem; cursor: pointer; }
.seg.wrap button:not(.btn) { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.seg button.on:not(.btn) { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip { font: inherit; font-size: .88rem; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: .2rem .65rem; cursor: pointer; }
.chip small { color: var(--muted); margin-left: .3rem; font-size: .75rem; }
.chip.hl { border-color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.on small { color: inherit; opacity: .8; }
.field { display: flex; flex-direction: column; gap: .35rem; }
.field > span { font-weight: 700; font-size: .9rem; }
.check { display: flex; align-items: center; gap: .45rem; font-size: .92rem; }
.stack { display: flex; flex-direction: column; gap: .5rem; }
.stack.row { flex-direction: row; flex-wrap: wrap; align-items: center; }
.tag { display: inline-block; font-size: .82rem; font-weight: 700; padding: .15rem .55rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.tag.red { background: transparent; color: var(--danger); padding: 0; }
.warn { color: var(--warn); background: var(--warn-soft); padding: .55rem .7rem; border-radius: 8px; margin: 0; }
.ok { color: var(--ok); margin: 0; }
.empty { color: var(--muted); padding: 2rem 1rem; text-align: center; }

/* hlavička */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 1.2rem; min-height: var(--head-h); flex-wrap: wrap;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: .35rem; }
.brand { display: flex; align-items: center; gap: .6rem; font-family: var(--serif); font-weight: 700; font-size: 1.2rem; white-space: nowrap; }
.mark { position: relative; display: inline-grid; place-items: end center; width: 30px; height: 32px; border: 2px solid var(--accent); border-radius: 5px;
  font: 700 13px/1 var(--sans); color: var(--accent); padding-bottom: 4px; font-variant-numeric: tabular-nums; }
.mark i { position: absolute; inset: 0 0 auto; height: 9px; background: var(--accent); }
.mark.big { width: 64px; height: 68px; border-width: 3px; border-radius: 9px; }
.mark.big i { height: 18px; }
.year { display: flex; align-items: center; gap: .35rem; font-variant-numeric: tabular-nums; }
.year b { font-family: var(--serif); font-size: 1.35rem; min-width: 3.2ch; text-align: center; }
.year .btn.icon { border-color: transparent; background: transparent; }
.tabs { display: flex; gap: .2rem; flex-wrap: wrap; }
.tabs a { text-decoration: none; color: var(--muted); font-weight: 500; padding: .5rem .8rem; border-radius: 8px; }
.tabs a:hover { color: var(--ink); background: var(--bg); }
.tabs a.on { color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.save { font-size: .85rem; white-space: nowrap; }
.save.ok { color: var(--ok); } .save.busy { color: var(--muted); } .save.err { color: var(--danger); font-weight: 700; }
.banner { background: var(--accent-soft); color: var(--ink); padding-block: .6rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: .95rem; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }

/* hlavní plocha */
.main { padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cal-grid, .ph-grid { display: grid; grid-template-columns: 250px minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.pagelist { display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - var(--head-h) - 48px); overflow-y: auto; position: sticky; top: calc(var(--head-h) + 16px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
.pl-item { font: inherit; display: flex; align-items: center; gap: .6rem; text-align: left; border: 0; background: transparent; color: var(--ink);
  padding: .45rem .55rem; border-radius: 8px; cursor: pointer; }
.pl-item:hover { background: var(--bg); }
.pl-item.on { background: var(--accent-soft); }
.pl-num { flex: none; width: 2rem; height: 2rem; display: grid; place-items: center; border-radius: 6px; background: var(--bg); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.pl-item.on .pl-num { background: var(--accent); color: var(--accent-ink); }
.pl-main { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.25; }
.pl-main b { font-weight: 700; font-size: .92rem; }
.pl-main small { color: var(--muted); font-size: .8rem; }
.pl-main .cel { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-dots { display: flex; gap: 3px; flex: none; }
.pl-dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.pl-dots i.on { background: var(--accent); border-color: var(--accent); }
.pl-sep { font-size: .78rem; font-weight: 700; color: var(--muted); padding: .7rem .6rem .25rem; letter-spacing: .04em; text-transform: uppercase; }
.cnt { font-size: .82rem; font-variant-numeric: tabular-nums; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 0 .5rem; }
.cnt.zero { color: var(--warn); }

.stage { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.toolbar { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.tb-title { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.tb-title b { font-family: var(--serif); font-size: 1.2rem; }
.tb-title small { color: var(--muted); }
.pc-wrap { width: 100%; display: flex; justify-content: center; }
.pc { display: block; max-width: 100%; background: #fff; box-shadow: var(--paper-shadow); border-radius: 2px; touch-action: none; }
.hint { color: var(--muted); font-size: .85rem; margin: 0; text-align: center; }

.inspector { position: sticky; top: calc(var(--head-h) + 16px); max-height: calc(100vh - var(--head-h) - 48px); overflow-y: auto; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: .8rem; }
.panel p { margin: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.slot-photo .thumb { width: 100%; height: 180px; object-fit: contain; background: var(--bg); border-radius: 8px; }
.cel-list, .ev-list, .checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
.ev-list li { display: flex; flex-wrap: wrap; gap: .2rem .5rem; align-items: baseline; }
.checks li { padding: .55rem .7rem; border-radius: 8px; }
.checks li.ok { background: var(--accent-soft); color: var(--ink); }
.checks li.warn { margin: 0; }
.confirm { background: var(--warn-soft); border-radius: 8px; padding: .7rem; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.confirm p { width: 100%; color: var(--warn); }
.confirm-inline { display: inline-flex; gap: .4rem; align-items: center; flex-wrap: wrap; }

/* fotky */
.thumb { display: block; object-fit: cover; }
.thumb.ph { background: var(--bg); border-radius: 6px; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 1.2rem; text-align: center; background: var(--panel); display: flex; flex-direction: column; gap: .4rem; align-items: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop small { color: var(--muted); }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.pick-grid.big { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.pick { font: inherit; border: 2px solid transparent; background: var(--panel); border-radius: 10px; padding: 0; overflow: hidden; cursor: pointer; text-align: left; color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.pick:hover { box-shadow: 0 0 0 2px var(--accent); }
.pick.on { border-color: var(--accent); }
.pick .thumb { width: 100%; aspect-ratio: 1; height: auto; border-radius: 0; }
.pick-meta { display: block; padding: .35rem .5rem; font-size: .78rem; line-height: 1.3; min-height: 2.2em; }
.pick-meta em { font-style: normal; color: var(--muted); }
.pick-meta b { color: var(--ok); font-weight: 500; }
.progress { position: relative; height: 26px; background: var(--bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.progress span { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); transition: width .2s; }
.progress small { position: relative; display: block; text-align: center; line-height: 24px; font-variant-numeric: tabular-nums; }

/* rodina, tisk */
.family, .print { display: flex; flex-direction: column; gap: 16px; max-width: 1180px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: .8rem; min-width: 0; }
.card p { margin: 0; }
.card-head { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
.card-head h2 { flex: 1; min-width: 12rem; }
.table-wrap { overflow-x: auto; }
table.people { border-collapse: collapse; width: 100%; }
table.people th { text-align: left; font-size: .82rem; color: var(--muted); font-weight: 700; padding: .4rem .5rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.people td { padding: .3rem .5rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.people td.num { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
table.people input:not([type]) { width: 100%; min-width: 9rem; }
table.people input.wide { min-width: 16rem; }
.portrait-btn { font: inherit; display: flex; align-items: center; gap: .4rem; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.portrait-btn .thumb { border-radius: 50%; }
.inline { display: flex; align-items: center; gap: .5rem; font-size: .92rem; }
.inline select { max-width: 16rem; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.theme-card { border: 2px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.theme-card.on { border-color: var(--accent); }
.theme-foot { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
.theme-foot small { display: block; color: var(--muted); }

/* dialog, oznámení, start */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 20, 25, .55); z-index: 20; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--panel); border-radius: 14px; width: min(980px, 100%); max-height: 88vh; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--panel);
  padding: .7rem 1.1rem; border-radius: 10px; box-shadow: var(--paper-shadow); max-width: min(560px, calc(100% - 32px)); }
.toast.err { background: var(--danger); color: #fff; }
.toast.warn { background: var(--warn); color: #fff; }
.splash { min-height: 70vh; display: grid; place-content: center; justify-items: center; gap: .8rem; text-align: center; padding: 16px; }
.splash p { margin: 0; max-width: 34rem; }
.setup form { width: min(420px, 100%); text-align: left; }
.setup input { width: 100%; font-size: 1.05rem; padding: .6rem .7rem; }

@media (max-width: 1180px) {
  .cal-grid, .ph-grid { grid-template-columns: 220px minmax(0, 1fr); }
  .inspector { grid-column: 1 / -1; position: static; max-height: none; }
}
@media (max-width: 760px) {
  .cal-grid, .ph-grid { grid-template-columns: minmax(0, 1fr); }
  .pagelist { position: static; max-height: 220px; }
  .compare { grid-template-columns: minmax(0, 1fr); }
  .top-in { gap: .6rem; }
  .brand span:last-child { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="core.js"></script>
<script src="render.js"></script>
<script src="store.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
